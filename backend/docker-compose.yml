services:
  postgres:
    image: postgres:16
    container_name: sonoma_postgres
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_DATABASE}
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/db/migration_up.sql:/docker-entrypoint-initdb.d/01-migration_up.sql
      - ./backend/db/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql

volumes:
  pgdata: